[project]
name = "mapfemrs"
version = "0.1.0"
description = "This project aims to create an ETL and find discrepancies (if there is any) in the data provided by the SSPRS and the Datasus platform."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
]
